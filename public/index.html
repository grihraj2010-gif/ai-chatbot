
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI KRANTI | Your AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050b18;
      color: #eaf6ff;
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      background: #091426;
      border-right: 1px solid #18334d;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #54dfff;
      text-shadow: 0 0 15px #00cfff;
      margin-bottom: 30px;
      padding: 8px;
    }

    .new-chat {
      background: linear-gradient(120deg, #087bba, #00b8d9);
      color: white;
      border: none;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .new-chat:hover {
      box-shadow: 0 0 18px #00bfff;
    }

    .history-heading {
      color: #7d9db7;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .history-list {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 11px;
      margin-bottom: 7px;
      border-radius: 7px;
      background: #102139;
      color: #c5d9e9;
      cursor: pointer;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover,
    .history-item.active {
      background: #16405c;
      color: #fff;
    }

    .sidebar-footer {
      color: #54758f;
      font-size: 11px;
      text-align: center;
      padding-top: 15px;
    }

    /* MAIN AREA */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #18334d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: rgba(8, 19, 36, 0.8);
    }

    .topbar h2 {
      font-size: 17px;
      letter-spacing: 2px;
      color: #bceeff;
    }

    .status {
      color: #36e6a3;
      font-size: 12px;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #36e6a3;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 10px #36e6a3;
    }

    /* CHAT AREA */

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow-y: auto;
    }

    /* ANIMATED AI CORE */

    .ai-core {
      width: 190px;
      height: 190px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 35px;
    }

    .core-glow {
      position: absolute;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: radial-gradient(circle, #37dcff, #0874c9 55%, #03152f);
      box-shadow:
        0 0 25px #00bfff,
        0 0 60px #0077ff,
        0 0 100px #004cff;
      animation: corePulse 2.5s ease-in-out infinite;
    }

    .core-letter {
      position: relative;
      z-index: 3;
      font-size: 35px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 15px #fff, 0 0 30px #00cfff;
    }

    .core-ring {
      position: absolute;
      width: 165px;
      height: 165px;
      border: 2px solid rgba(0, 200, 255, 0.7);
      border-radius: 50%;
      box-shadow: 0 0 15px #008cff;
      animation: rotateRing 7s linear infinite;
    }

    .core-ring.second {
      width: 135px;
      height: 180px;
      border-color: rgba(0, 255, 220, 0.6);
      transform: rotateX(65deg);
      animation: rotateRingReverse 5s linear infinite;
    }

    .core-ring.third {
      width: 180px;
      height: 120px;
      border-color: rgba(0, 140, 255, 0.6);
      transform: rotateY(65deg);
      animation: rotateRing 9s linear infinite;
    }

    /* YELLOW ELLIPSE */

    .yellow-ellipse {
      position: absolute;
      width: 205px;
      height: 65px;
      border: 3px solid #ffdf00;
      border-radius: 50%;
      box-shadow:
        0 0 10px #ffdf00,
        0 0 25px #ffae00,
        inset 0 0 10px #ffdf00;
      animation: yellowOrbit 5s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    /* KRANTI ANIMATION */

    .kranti-word {
      position: absolute;
      z-index: 5;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #ffe45c;
      white-space: nowrap;
      text-shadow:
        0 0 8px #ffdf00,
        0 0 20px #ffae00;
      animation: krantiFloat 3s ease-in-out infinite;
    }

    .kranti-word span {
      display: inline-block;
      animation: letterGlow 1.8s ease-in-out infinite;
    }

    .kranti-word span:nth-child(2) { animation-delay: .12s; }
    .kranti-word span:nth-child(3) { animation-delay: .24s; }
    .kranti-word span:nth-child(4) { animation-delay: .36s; }
    .kranti-word span:nth-child(5) { animation-delay: .48s; }
    .kranti-word span:nth-child(6) { animation-delay: .60s; }

    @keyframes corePulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.13);
        filter: brightness(1.4);
      }
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingReverse {
      from { transform: rotateX(65deg) rotate(360deg); }
      to { transform: rotateX(65deg) rotate(0deg); }
    }

    @keyframes yellowOrbit {
      0% {
        transform: translate(-12px, -12px) rotate(-25deg);
      }
      25% {
        transform: translate(12px, -22px) rotate(15deg);
      }
      50% {
        transform: translate(12px, 12px) rotate(35deg);
      }
      75% {
        transform: translate(-12px, 22px) rotate(-15deg);
      }
      100% {
        transform: translate(-12px, -12px) rotate(-25deg);
      }
    }

    @keyframes krantiFloat {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -9px);
      }
    }

    @keyframes letterGlow {
      0%, 100% {
        opacity: .65;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-5px);
        text-shadow: 0 0 15px #fff, 0 0 25px #ffdf00;
      }
    }

    .welcome h1 {
      font-size: 30px;
      letter-spacing: 4px;
      color: #d9f7ff;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #7fa7c2;
      font-size: 14px;
    }

    /* MESSAGES */

    .messages {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 25px 7%;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 75%;
      padding: 14px 17px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(120deg, #087cba, #07518a);
      color: white;
      border-bottom-right-radius: 3px;
    }

    .ai-message {
      align-self: flex-start;
      background: #10243b;
      border: 1px solid #1b4564;
      color: #d7efff;
      border-bottom-left-radius: 3px;
    }

    .typing {
      color: #6f9dbd;
      font-size: 13px;
      padding: 5px 10px;
    }

    /* INPUT AREA */

    .input-area {
      padding: 18px 7% 22px;
      border-top: 1px solid #18334d;
      background: #081426;
    }

    .input-box {
      display: flex;
      gap: 10px;
      max-width: 900px;
      margin: auto;
    }

    .input-box input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      background: #10243b;
      border: 1px solid #24516d;
      border-radius: 10px;
      outline: none;
      color: white;
      font-size: 14px;
    }

    .input-box input:focus {
      border-color: #00cfff;
      box-shadow: 0 0 12px rgba(0, 200, 255, .2);
    }

    .input-box button {
      padding: 0 25px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(120deg, #087bba, #00b8d9);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .input-box button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .powered {
      text-align: center;
      color: #4c718d;
      font-size: 10px;
      margin-top: 13px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .sidebar {
        width: 190px;
        padding: 15px 10px;
      }

      .logo {
        font-size: 19px;
        letter-spacing: 2px;
      }

      .topbar {
        padding: 0 13px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .messages {
        padding: 18px 12px;
      }

      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 13px 10px;
      }

      .input-box button {
        padding: 0 15px;
      }

      .ai-core {
        transform: scale(.85);
        margin-bottom: 15px;
      }
    }

    @media (max-width: 430px) {
      .sidebar {
        width: 145px;
      }

      .logo {
        font-size: 16px;
      }

      .history-item {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">AI KRANTI</div>

    <button class="new-chat" onclick="newChat()">
      + New Conversation
    </button>

    <div class="history-heading">CHAT HISTORY</div>

    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">
      YOUR PERSONAL AI ASSISTANT
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">
      <h2>AI KRANTI</h2>
      <div class="status">SYSTEM ONLINE</div>
    </header>

    <section class="chat-area">

      <!-- WELCOME SCREEN -->

      <div class="welcome" id="welcome">

        <div class="ai-core">

          <div class="core-ring"></div>
          <div class="core-ring second"></div>
          <div class="core-ring third"></div>

          <div class="core-glow"></div>

          <div class="core-letter">K</div>

          <div class="yellow-ellipse"></div>

          <div class="kranti-word">
            <span>K</span><span>R</span><span>A</span><span>N</span><span>T</span><span>I</span>
          </div>

        </div>

        <h1>WELCOME TO AI KRANTI</h1>

        <p>Your ideas. Your questions. Your AI assistant.</p>

      </div>

      <!-- CHAT MESSAGES -->

      <div class="messages" id="messages"></div>

    </section>

    <!-- INPUT -->

    <footer class="input-area">

      <div class="input-box">

        <input
          type="text"
          id="userInput"
          placeholder="Ask AI KRANTI anything..."
          autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
          SEND
        </button>

      </div>

      <div class="powered">
        POWERED BY KRANTI · AI KRANTI
      </div>

    </footer>

  </main>

</div>

<script>
  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const historyList = document.getElementById("historyList");
  const sendButton = document.getElementById("sendButton");

  let chats = [];
  let currentChatId = null;
  let isSending = false;

  // LOAD SAVED CHATS

  try {
    chats = JSON.parse(
      localStorage.getItem("jarvis_chat_history") || "[]"
    );

    if (!Array.isArray(chats)) {
      chats = [];
    }
  } catch {
    chats = [];
  }

  function saveChats() {
    try {
      localStorage.setItem(
        "jarvis_chat_history",
        JSON.stringify(chats)
      );
    } catch (error) {
      console.error("Could not save chat history:", error);
    }
  }

  // CREATE NEW CHAT

  function newChat() {
    if (isSending) return;

    currentChatId = Date.now();

    chats.unshift({
      id: currentChatId,
      title: "New Conversation",
      messages: []
    });

    messages.innerHTML = "";
    messages.style.display = "none";
    welcome.style.display = "flex";

    saveChats();
    renderHistory();
    input.focus();
  }

  // DISPLAY HISTORY

  function renderHistory() {
    historyList.innerHTML = "";

    chats.forEach(chat => {
      const item = document.createElement("div");

      item.className = "history-item";

      if (chat.id === currentChatId) {
        item.classList.add("active");
      }

      item.textContent = chat.title || "New Conversation";

      item.addEventListener("click", () => {
        openChat(chat.id);
      });

      historyList.appendChild(item);
    });
  }

  // OPEN OLD CHAT

  function openChat(id) {
    if (isSending) return;

    const chat = chats.find(c => c.id === id);

    if (!chat) return;

    currentChatId = id;

    welcome.style.display = "none";
    messages.style.display = "flex";
    messages.innerHTML = "";

    chat.messages.forEach(message => {
      addMessage(message.text, message.sender);
    });

    renderHistory();
  }

  // CREATE A CHAT WHEN NEEDED

  function getCurrentChat() {
    let chat = chats.find(c => c.id === currentChatId);

    if (!chat) {
      currentChatId = Date.now();

      chat = {
        id: currentChatId,
        title: "New Conversation",
        messages: []
      };

      chats.unshift(chat);
    }

    return chat;
  }

  // ADD MESSAGE TO SCREEN

  function addMessage(text, sender) {
    const div = document.createElement("div");

    div.className =
      sender === "user"
        ? "message user-message"
        : "message ai-message";

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }

  // SEND MESSAGE

  async function sendMessage() {
    const message = input.value.trim();

    if (!message || isSending) return;

    isSending = true;
    sendButton.disabled = true;

    welcome.style.display = "none";
    messages.style.display = "flex";

    const chat = getCurrentChat();

    // USER MESSAGE

    addMessage(message, "user");

    chat.messages.push({
      sender: "user",
      text: message
    });

    if (chat.messages.length === 1) {
      chat.title = message.slice(0, 30);
    }

    input.value = "";

    saveChats();
    renderHistory();

    // TYPING INDICATOR

    const typing = document.createElement("div");

    typing.className = "typing";
    typing.textContent = "AI KRANTI is thinking...";

    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;

    try {

      // SEND REQUEST TO YOUR EXPRESS BACKEND

      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Server error");
      }

      const reply = data.reply || "I couldn't generate a response.";

      typing.remove();

      addMessage(reply, "ai");

      chat.messages.push({
        sender: "ai",
        text: reply
      });

      saveChats();

    } catch (error) {

      console.error("Chat error:", error);

      typing.remove();

      addMessage(
        "Sorry, something went wrong. Please try again.",
        "ai"
      );

    } finally {

      isSending = false;
      sendButton.disabled = false;
      input.focus();

    }
  }

  // PRESS ENTER TO SEND

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  // INITIALIZE

  renderHistory();

  if (chats.length > 0) {
    openChat(chats[0].id);
  } else {
    newChat();
  }
</script>

</body>
</html>
